# Builds RADAR from the tagged source and attaches the installer, the portable zip and their checksums to a
# release. The release files come from exactly this public build - compare SHA256SUMS.txt with what you downloaded,
# or let GitHub confirm where a file was built: gh attestation verify <file> --repo EXepCion/RADAR
#
# The build job can only read the repository. Publishing is a job of its own that runs none of the project's code.
# Actions are pinned to a commit, not to a tag that could be moved.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.17"
      - name: Install
        run: python -m pip install -e .[dev] pyinstaller
      - name: Run the tests
        run: python -m pytest -q
      - name: The tag must match the version in the source
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import radar; print(radar.__version__)"
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match version $version" }
      - name: Build the program, the zip and the installer
        shell: pwsh
        run: ./packaging/build.ps1 -Python python
      - name: Show the checksums and what the build used
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS.txt
          python -m pip freeze
      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Get-ChildItem dist -File | Where-Object { $_.Name -match '^RADAR-.*\.(exe|zip)$' -or $_.Name -eq 'SHA256SUMS.txt' } | Copy-Item -Destination release
          Copy-Item packaging/RELEASE_NOTES.md release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write    # store it
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release
      - name: Attest that these files were built here, from this tag
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/RADAR-*.exe
            release/RADAR-*.zip
      - name: Publish the release
        run: |
          mv release/RELEASE_NOTES.md notes.md
          gh release create "$TAG" release/* --title "RADAR $TAG" --notes-file notes.md --verify-tag
